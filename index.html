<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desserts Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container">

  <main class="products-section">
    <h1>Desserts</h1>
    <div id="productsGrid" class="products-grid"></div>
  </main>

  <aside class="cart">
    <h2>Your Cart (<span id="cartCount">0</span>)</h2>

    <div id="cartItems">
      <p class="empty">Your added items will appear here.</p>
    </div>

    <div id="cartFooter" class="cart-footer hidden">
      <div class="total">
        <span>Order Total</span>
        <h3 id="totalPrice">$0.00</h3>
      </div>

      <div class="delivery">
        <img src="assets/images/icon-carbon-neutral.svg" alt="Carbon neutral icon">
        <span>This is a carbon-neutral delivery</span>
      </div>

      <button class="confirm-btn" id="confirmOrder" type="button">Confirm Order</button>
    </div>
  </aside>

</div>

<script src="script.js"></script>
</body>
</html>
